<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; background: #000; color: white; text-align: center; font-family: sans-serif; }
        .slide-container { height: 80vh; display: flex; justify-content: center; align-items: center; }
        .slide { max-width: 90%; max-height: 90%; opacity: 0; position: absolute; transition: opacity 1s; }
        .slide.active { opacity: 1; }
        #timer { font-size: 2.5rem; color: #00d4ff; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="slide-container">
        <img src="1780782597681.jpeg" class="slide active"> <img src="1000038052.jpg" class="slide">
        <img src="1000038048.jpg" class="slide">
        <img src="1000038049.jpg" class="slide">
        <img src="1000038050.jpg" class="slide">
    </div>

    <div id="timer">Loading...</div>

    <script>
        // Logica Slide: cambia ogni 2 secondi
        let slides = document.querySelectorAll('.slide');
        let index = 0;
        setInterval(() => {
            slides[index].classList.remove('active');
            index = (index + 1) % slides.length;
            slides[index].classList.add('active');
        }, 2000); 

        // Logica Timer: punta al 27 Giugno 2026 ore 16:00
        const target = new Date("June 27, 2026 16:00:00").getTime();
        setInterval(() => {
            const diff = target - new Date().getTime();
            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);
            document.getElementById("timer").innerHTML = `${d}d ${h}h ${m}m ${s}s`;
        }, 1000);
    </script>
</body>
</html>
